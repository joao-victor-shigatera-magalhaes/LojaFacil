<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadatro de usuario</title>
</head>
<body>
    <h1>cadastro de usuario</h1>

    <form method="post"> 
<div>
    <label for="name">Nome completo:</label>
    <input type="text" id="nome" name="nome"
        autocomplete="name" required>
</div>
<br>
<div>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email"
    autocomplete="email" required>
</div>
<br>
<div>
    <label for="usuario">Usuario:</label>
    <input type="text" id="usuario" name="usuario"
    autocomplete="username" required>
</div>
<br>
<div>
    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf"
        inputmode="numeric" maxlength="14"
        placeholder="000.000.000-00" required>
</div>
<br>
<fieldset>
    <legend>Sexo:</legend>
    <label><input type="radio" name="sexo"
        value="feminino"> Feminino</label>
    <label><input type="radio" name="sexo"
        value="masculino">Masculino</label>
    <label><input type="radio" name="sexo"
        value="nao_informar"> Prefiro não informar</label>
</fieldset>
<br>
<div>
    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha"
        minlength="8" autocomplete="new-password"
        required>
</div>
<br>
<div>
    <label for="confirmar_senha">Confirmar Senha:</label>
    <input type="password" id="confirmar_senha" name="confirmar_senha"
    minlength="8" autocomplete="new-password"
    required>
</div>
<br><br>
<button type="reset">limpar</button>
<button type="submit">Cadastrar</button>
</form>
<p><a href="../index.html">voltar ao login</a></p>

<script>
    // Localiza o campo CPF.
    const cpf = document.getElementById("cpf");

    // Aplica a máscara enquanto o usuário digita.
    cpf.addEventListener("input", function () {

      // Remove caracteres que não são dígitos.
      // Mantém no máximo onze dígitos.
      let numeros = cpf.value.replace(/\D/g, "").slice(0, 11);

      // Insere o primeiro ponto.
      numeros = numeros.replace(
        /^(\d{3})(\d)/,
        "$1.$2"
      );

      // Insere o segundo ponto.
      numeros = numeros.replace(
        /^(\d{3})\.(\d{3})(\d)/,
        "$1.$2.$3"
      );

      // Insere o hífen antes dos dois últimos dígitos.
      numeros = numeros.replace(
        /(\d{3})\.(\d{3})\.(\d{3})(\d)/,
        "$1.$2.$3-$4"
      );

      // Atualiza o conteúdo do campo.
      cpf.value = numeros;
    });
  </script>
</body>
</html>
